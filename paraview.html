   <style>
    .viewer {
        position: relative;
        width: 90vw;
        height: 85vh;
        margin: 0 auto;
    }
    .viewer iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: none;
    }
    #infoOverlayBtn {
        position: absolute;
        bottom: 10px;
        right: 180px;
        z-index: 10;
        background-color: #272727;
        color: white;
        font-weight: bold;
        border: none;
        padding: 2px 4px;
        cursor: pointer;
    }
    #infoPanel {
        position: absolute;
        top: 80px;
        left: 350px;
        z-index: 10;
        background-color: rgba(255, 255, 255, 0.9);
        padding: 20px;
        border-radius: 5px;
        display: none; 
    }
    #infoPanel.open {
        display: block; 
    }
    #infoOverlayBtn.hidden {
        display: none; 
    }

   </style>

   <div class="viewer">
        <iframe id='iframe' style='display:block; margin:0 auto; border:0; width:90vw; height:85vh;'></iframe>
        <button id="infoOverlayBtn"> Information </button>
        <div id = "infoPanel">
            <h3 id = "infoTitle"></h3>
            <p id = "infoText"></p>
        </div>
    </div>

   <script>
    var app="https://kitware.github.io/paraview-glance/app";
    var datadir="https://raw.githubusercontent.com/Objork/PlasmaCalculator/test_version/CelestialBodiesFiles/";
    var infoUrl = datadir + "celestial_bodies_info.json"
    
    var files = {
        1: "mercury.vtkjs",
        2: "venus.vtkjs",
        3: "luna.vtkjs",
        4: "comet2_4.vtkjs"
    }

    var info = {};
    var currentFile = null;

    var iframe = document.getElementById('iframe');
    var infoBtn = document.getElementById('infoOverlayBtn');
    var infoPanel = document.getElementById('infoPanel');

    function updateInfoPanel(file) {
        var infoEntry = info[file] || {title: "Unknown", text: "No information available."};
        document.getElementById("infoTitle").textContent = infoEntry.title;
        document.getElementById("infoText").textContent = infoEntry.text;
    }

    var loadId = 0;

    function loadFile(file) {
    currentFile = file;
    var myId = ++loadId;

    infoBtn.classList.add("hidden");
    infoPanel.classList.remove("open");
    updateInfoPanel(file);

    var iframeReady = false;
    var fileReady = false;

    function maybeShow() {
        if (myId !== loadId) return;
        if (iframeReady && fileReady) {
        setTimeout(function () {
            if (myId === loadId) infoBtn.classList.remove("hidden");
        }, 500);
        }
    }

    iframe.onload = function () { iframeReady = true; maybeShow(); };

    fetch(datadir + file)
        .then(function (r) { return r.blob(); })
        .catch(function () {})
        .then(function () { fileReady = true; maybeShow(); });

    iframe.src = app + "?name=" + encodeURIComponent(file) +
                "&url=" + encodeURIComponent(datadir + file);
    }

    function enableBrand(sel) {
        var file = files[sel.value];
        if (file) {
            loadFile(file);
        }
    }
    

    infoBtn.addEventListener("click", function() {
        infoPanel.classList.toggle("open");
    });

    loadFile(files[1]);

    fetch(infoUrl)
        .then(response => response.json())
        .then(data => {
            info = data;
            updateInfoPanel(currentFile);
        })
        .catch(error => console.error('Error loading info JSON:', error));

   </script>
